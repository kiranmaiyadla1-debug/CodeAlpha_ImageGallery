<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>My Image Gallery</h1>

<!-- FILTER BUTTONS -->
<div class="filters">
  <button onclick="filterImages('all')">All</button>
  <button onclick="filterImages('vehicle')">Vehicles</button>
  <button onclick="filterImages('nature')">Nature</button>
  <button onclick="filterImages('people')">People</button>
</div>

<!-- GALLERY -->
<div class="gallery">

  <img src="images/car.jpeg" class="vehicle" onclick="openImage(this)">
  <img src="images/bike.jpeg" class="vehicle" onclick="openImage(this)">
  <img src="images/nature.jpeg" class="nature" onclick="openImage(this)">
  <img src="images/AA.jpeg" class="people" onclick="openImage(this)">

</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span onclick="closeImage()">❌</span>
  <button onclick="prevImage()">⬅</button>
  <img id="lightbox-img">
  <button onclick="nextImage()">➡</button>
</div>

<script src="script.js"></script>
</body>
</html>
